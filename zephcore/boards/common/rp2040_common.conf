# RP2040 Platform Configuration (Waveshare RP2040-LoRa)
#
# Included by all boards under boards/rp2040/. The RP2040 has no radio besides
# the SX1262 on the board and no WiFi/BLE, so builds are USB-CLI only. Flashing
# is UF2 drag-and-drop (zephyr.uf2 to the RPI-RP2 drive).
#
# Include order: prj.conf -> zephcore_common.conf -> rp2040_common.conf -> board.conf

# ========== No Bluetooth ==========
CONFIG_BT=n

# ========== USB CDC ACM (new USB device stack, as on nRF52) ==========
# adapters/usb/ZephyrUSBCDC.cpp owns the usbd init.
CONFIG_USB_DEVICE_STACK_NEXT=y

# ========== Entropy ==========
# No hardware RNG on the RP2040. The only source is the ring-oscillator bit
# (adapters/rng/entropy_rp2040_rosc.c, selected by CONFIG_ZEPHCORE_ENTROPY_RP2040_ROSC),
# which is not a certified TRNG: Zephyr layers a DRBG on it
# (ENTROPY_NEEDS_PRNG) and ZephyrRNG adds CPU-jitter conditioning on top.
CONFIG_ENTROPY_GENERATOR=y

# AES lookup tables in flash instead of RAM (flash is plentiful on 2 MB).
CONFIG_MBEDTLS_AES_ROM_TABLES=y

# ========== Bring-up diagnostic ==========
# LED stage markers (adapters/board/rp2040_boot_diag.h). Remove once the board boots.
CONFIG_ZEPHCORE_RP2040_BOOT_DIAG=y
