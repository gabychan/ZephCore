name: ZephCore build (RP2040)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Placa"
        required: true
        default: waveshare_rp2040_lora
        type: choice
        options:
          - waveshare_rp2040_lora
      app:
        description: "Que compilar"
        required: true
        default: repeater
        type: choice
        options:
          - repeater
          - smoke

env:
  zephyr_sdk: 1.0.1
  python_version: 3.12

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '${{ env.python_version }}'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephcore
          toolchains: arm-zephyr-eabi
          sdk-version: ${{ env.zephyr_sdk }}
          enable-ccache: 'false'

      - name: Build repeater
        if: ${{ inputs.app == 'repeater' }}
        env:
          BOARD: ${{ inputs.board }}
        run: |
          west build -b "$BOARD" zephcore --pristine -- -DEXTRA_CONF_FILE="boards/common/repeater.conf"
          mkdir -p firmware
          SHORT=$(git rev-parse --short HEAD)
          cp build/zephyr/zephyr.uf2 "firmware/${BOARD}-repeater-${SHORT}.uf2"
          cp build/zephyr/zephyr.hex "firmware/${BOARD}-repeater-${SHORT}.hex"
          ls -l firmware
          west build -t rom_report > firmware/rom_report.txt 2>&1 || true
          west build -t ram_report > firmware/ram_report.txt 2>&1 || true

      # Zephyr's own samples on the same board definition, to tell a board
      # problem (boot, flash layout, LED pin, USB) from a ZephCore one.
      #   blinky:  LED on led0 (GP25) toggling every second
      #   cdc_acm: USB serial port that echoes what is typed
      - name: Build smoke tests
        if: ${{ inputs.app == 'smoke' }}
        env:
          BOARD: ${{ inputs.board }}
        run: |
          OVERLAY="$PWD/zephcore/boards/rp2040/waveshare_rp2040_lora/smoke.overlay"
          BLINKY_OVERLAY="$PWD/zephcore/boards/rp2040/waveshare_rp2040_lora/smoke_blinky.overlay"
          mkdir -p firmware
          west build -b "$BOARD" zephyr/samples/basic/blinky -d build_blinky --pristine -- \
            -DBOARD_ROOT="$PWD/zephcore" -DDTC_OVERLAY_FILE="$BLINKY_OVERLAY" \
            -DCONFIG_CONSOLE=n -DCONFIG_UART_CONSOLE=n
          cp build_blinky/zephyr/zephyr.uf2 "firmware/${BOARD}-smoke-blinky.uf2"
          west build -b "$BOARD" zephyr/samples/subsys/usb/cdc_acm -d build_cdc --pristine -- \
            -DBOARD_ROOT="$PWD/zephcore" -DDTC_OVERLAY_FILE="$OVERLAY"
          cp build_cdc/zephyr/zephyr.uf2 "firmware/${BOARD}-smoke-cdc_acm.uf2"
          # USB isolation variants:
          #  A: our board, MPU off (stock rpi_pico runs without it)
          #  B: stock rpi_pico, same sample (same silicon: if this also fails
          #     to enumerate, the cause is the physical board, not our DTS)
          west build -b "$BOARD" zephyr/samples/subsys/usb/cdc_acm -d build_cdc_nompu --pristine -- \
            -DBOARD_ROOT="$PWD/zephcore" -DDTC_OVERLAY_FILE="$OVERLAY" -DCONFIG_ARM_MPU=n
          cp build_cdc_nompu/zephyr/zephyr.uf2 "firmware/${BOARD}-smoke-cdc_acm-A-nompu.uf2"
          west build -b rpi_pico zephyr/samples/subsys/usb/cdc_acm -d build_cdc_pico --pristine
          cp build_cdc_pico/zephyr/zephyr.uf2 "firmware/rpi_pico-smoke-cdc_acm-B-stock.uf2"
          ls -l firmware

      - uses: actions/upload-artifact@v7
        with:
          name: zephcore-${{ inputs.board }}-${{ inputs.app }}
          path: firmware
          if-no-files-found: error
          retention-days: 30
