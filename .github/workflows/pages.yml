name: Deploy Website & Docs to GitHub Pages

on:
  workflow_run:
    workflows: ["build firmware"]
    types: [completed]
    branches: [master]
  push:
    branches:
      - master
    paths:
      - "custom_builder_web/**"
      - "tests/web/**"
      - "zephcore/boards/**/zephcore.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    # A cancelled or failed firmware build must never publish. `workflow_run`
    # fires on every completion, so without this a build cancelled by a newer
    # push deployed the previous release: on 2026-11-23 that put a catalog on
    # Pages one commit behind the release, under the same version label, with no
    # way to notice from the page.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test the flasher and builder logic
        run: node --test tests/web/*.test.*

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      # The browser cannot fetch Release assets (no CORS header), so the site carries
      # the latest release's files itself and a catalog pointing at them.
      - name: Add the latest release's firmware and catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -r requirements.txt
          tag="$(gh release view --json tagName --jq .tagName)"
          gh release download "$tag" --dir custom_builder_web/firmware
          python gen_provider_catalog.py --firmware-dir custom_builder_web/firmware \
            --url-base "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/firmware" \
            --version "$tag" --out custom_builder_web/firmware/catalog.json

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stamp local scripts and styles with the commit
        run: |
          find custom_builder_web -name '*.html' -exec sed -i -E \
            "s#((src|href)=\"(\.\./)?(js|css|vendor)/[^\"?]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#" {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "custom_builder_web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
