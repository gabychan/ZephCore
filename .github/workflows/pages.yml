name: Deploy Website & Docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "custom_builder_web/**"
      - "tests/web/**"
      - "zephcore/boards/**/zephcore.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test the flasher and builder logic
        run: node --test tests/web/*.test.js

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Stamp local scripts and styles with the commit
        run: |
          find custom_builder_web -name '*.html' -exec sed -i -E \
            "s#((src|href)=\"(\.\./)?(js|css|vendor)/[^\"?]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#" {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "custom_builder_web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
