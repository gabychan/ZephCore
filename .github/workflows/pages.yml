name: Deploy Website & Docs to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "custom_builder_web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stamp local scripts and styles with the commit
        run: |
          find custom_builder_web -name '*.html' -exec sed -i -E \
            "s#((src|href)=\"(\.\./)?(js|css|vendor)/[^\"?]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#" {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "custom_builder_web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
