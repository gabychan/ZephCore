name: battery-wake pre-release (ZephCore, repeater)

# Plain ZephCore (no Meshtastic bridge): a repeater with the low-battery
# auto-shutdown and the LPCOMP battery wake, published as a GitHub pre-release
# for beta testers. Runs on every push to this branch and by hand.

on:
  push:
    branches: [ "battery-wake-zephcore" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  zephyr_sdk: 1.0.1
  python_version: 3.12

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Only boards whose devicetree has the LPCOMP node, i.e. where the
        # threshold was measured on the bench. Add a board here once it is.
        board: [ promicro_sx1262 ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '${{ env.python_version }}'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Setup Zephyr project
        uses: zephyrproject-rtos/action-zephyr-setup@be8136a8bba01580485d98b7ad2d32477c36a49a # v1.0.15
        with:
          app-path: zephcore
          toolchains: arm-zephyr-eabi
          sdk-version: ${{ env.zephyr_sdk }}
          enable-ccache: 'false'

      - name: Build
        env:
          BOARD: ${{ matrix.board }}
        run: |
          west build -b "$BOARD" zephcore --pristine -- -DEXTRA_CONF_FILE="boards/common/repeater.conf"
          mkdir -p firmware
          SHORT=$(git rev-parse --short HEAD)
          cp build/zephyr/zephyr.uf2 "firmware/${BOARD}-repeater-battery-wake-${SHORT}.uf2"
          cp build/zephyr/zephyr.zip "firmware/${BOARD}-repeater-battery-wake-${SHORT}.zip"
          ls -l firmware

      - uses: actions/upload-artifact@v7
        with:
          name: battery-wake-${{ matrix.board }}
          path: firmware
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          pattern: battery-wake-*
          path: firmware
          merge-multiple: true

      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(git rev-parse --short HEAD)
          TAG="battery-wake-zephcore-${SHORT}"
          gh release create "$TAG" firmware/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "battery-wake (ZephCore) ${SHORT}" \
            --notes "Pre-release for beta testers: ZephCore repeater with low-battery auto-shutdown and LPCOMP battery wake. Only the ProMicro SX1262 is validated on the bench. Commands: get|set autoshutdown <mV>."
