name: host regression tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Run real production code with ASan and UBSan
        run: python tests/run.py run --profile quick --sanitize
      - name: Web flasher and builder tests
        run: node --test tests/web/*.test.*
      - name: Retain results and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: host-regression-results
          path: test-results/
          if-no-files-found: error
          retention-days: 14
